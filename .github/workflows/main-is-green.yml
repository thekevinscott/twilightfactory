name: Main is green

# Blocks pull requests while main is red. Recheck blocked pull requests re-runs failed checks once main passes.
# A pull request labeled run-ci is judged by its own tests.yml run instead; Recheck run-ci
# pull requests re-runs this check when that run finishes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  main-is-green:
    name: Main is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check main, or this head's own run if labeled run-ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node .github/scripts/main-is-green.mjs
