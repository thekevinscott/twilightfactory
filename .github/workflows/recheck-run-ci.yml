name: Recheck run-ci pull requests

# When a tests.yml run on a branch finishes, re-run the failed "Main is green" check on
# that commit so a run-ci pull request picks up the result.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: write

jobs:
  recheck:
    if: github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$REPO/actions/workflows/main-is-green.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] // {} | "\(.id // "") \(.conclusion // "")"')
          read -r id conclusion <<< "$run"
          if [ -z "$id" ] || [ "$conclusion" != failure ]; then
            echo "Nothing to recheck at $HEAD_SHA (${conclusion:-none})."
            exit 0
          fi
          gh run rerun "$id" --repo "$REPO" --failed
