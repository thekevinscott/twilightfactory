name: Main is green

# Blocks pull requests while main is red. tf re-runs failed checks once main passes.
on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main-is-green:
    name: Main is green
    runs-on: ubuntu-latest
    steps:
      - name: Check the last tests run on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTS_WORKFLOW: tests.yml
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/actions/workflows/$TESTS_WORKFLOW" --silent 2>/dev/null; then
            echo "No $TESTS_WORKFLOW in $REPO."
            exit 0
          fi
          run=$(gh run list --repo "$REPO" --workflow "$TESTS_WORKFLOW" --branch main --status completed --limit 1 --json conclusion,url --jq '.[0] // {} | "\(.conclusion // "") \(.url // "")"')
          read -r conclusion url <<< "$run"
          if [ -z "$conclusion" ] || [ "$conclusion" = success ]; then
            echo "main is green"
          else
            echo "main is red ($conclusion): $url"
            exit 1
          fi
