# NETWORK picks what the tests reach: replay (each test's fixture folder, no internet),
# record (the internet, JSON responses saved to recordings/), live (the internet, nothing saved).
# The proxy runs inside each test file (packages/test-proxy).
services:
  tests:
    build: .
    user: "${HOST_UID}:${HOST_GID}"
    working_dir: ${WORKTREE}
    environment:
      NETWORK: ${NETWORK:-replay}
      pnpm_config_verify_deps_before_run: "false"
    volumes:
      - ${REPOSITORY}:${REPOSITORY}
      - ${CURTAINCALL}:${CURTAINCALL}:ro
    networks: ["${EGRESS}"]

networks:
  internet: {}
  nowhere:
    internal: true
