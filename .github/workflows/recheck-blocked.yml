name: Recheck blocked pull requests

# When main goes green, re-run the failed "Main is green" check on every open pull request.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  actions: write
  pull-requests: read

jobs:
  recheck:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for sha in $(gh pr list --repo "$REPO" --state open --limit 100 --json headRefOid --jq '.[].headRefOid'); do
            id=$(gh api "repos/$REPO/actions/workflows/main-is-green.yml/runs?head_sha=$sha&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] // {} | select(.conclusion == "failure") | .id')
            if [ -n "$id" ]; then
              echo "Re-running Main is green at $sha (run $id)."
              gh run rerun "$id" --repo "$REPO" --failed
            fi
          done
