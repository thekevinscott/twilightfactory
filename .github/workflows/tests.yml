name: Tests
# tf reads the kind back from the run name.
run-name: Tests (${{ inputs.kind }})

on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [plain, measured]
        default: plain

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      pnpm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4
      # Not on npm: build it from GitHub at a pinned commit.
      - uses: actions/checkout@v4
        with:
          repository: thekevinscott/curtaincall
          ref: 38824c8e5e50fe0fb218c029eaa02682c20665b5 # main, after PR 57
          path: .deps/curtaincall
      - uses: extractions/setup-just@v3
      # Install and build inside the test image: node-pty's native module must
      # link against the container's glibc, not the runner's newer one.
      - run: docker build -t tf-tests tests/docker
      - run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" \
            -e pnpm_config_frozen_lockfile tf-tests bash -euc '
              (cd .deps/curtaincall/packages/ts; pnpm install; pnpm run build)
              pnpm pkg set devDependencies.curtaincall=link:./.deps/curtaincall/packages/ts
              just install'
      - run: just test
